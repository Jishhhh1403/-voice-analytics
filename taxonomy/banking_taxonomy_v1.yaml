version: "1.0.0"
updated_at: "2026-10-30"
description: >
  Versioned banking application taxonomy for the Customer Intelligence platform.
  A node describes an app module/feature (not a customer-journey stage). Problems
  may map to a primary feature node and optional secondary nodes.
nodes:
  - node_id: authentication
    parent_id: null
    node_type: module
    display_name: Authentication
    description: Login, credentials, OTP, biometric verification and session management.
    synonyms: [login, sign in, sign-in, access, authentication, security check]
    status: active

  - node_id: auth.login
    parent_id: authentication
    node_type: feature
    display_name: Login
    description: Username/password and general account access.
    synonyms: [login, log in, sign in, password, credentials, access account]
    status: active

  - node_id: auth.password_reset
    parent_id: authentication
    node_type: feature
    display_name: Password reset
    description: Forgot-password and credential recovery.
    synonyms: [forgot password, reset password, change password, password recovery]
    status: active

  - node_id: auth.otp
    parent_id: authentication
    node_type: feature
    display_name: OTP verification
    description: One-time passwords and verification codes.
    synonyms: [otp, one time password, verification code, security code, sms code]
    status: active

  - node_id: auth.biometric
    parent_id: authentication
    node_type: feature
    display_name: Biometric login
    description: Fingerprint, face recognition and device biometric login.
    synonyms: [biometric, fingerprint, face id, face recognition, face unlock]
    status: active

  - node_id: auth.session
    parent_id: authentication
    node_type: feature
    display_name: Session management
    description: Session expiry, logout behaviour and re-authentication.
    synonyms: [session, signed out, logged out, session expired, re-authenticate, timeout]
    status: active

